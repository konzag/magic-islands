name: CI

# Static game repo (GAME-STANDARD §2): every PR into staging/main and every push to staging/main runs the
# Playwright smoke of index.html under the games-hub CSP (GAME-STANDARD §7) and a secret scan; Auto-merge waits for
# these checks. The ruleset (owner decision D21) requires the checks `test` and `gitleaks` on PRs: keep those job
# ids/names (tests/ci-workflow.spec.ts). Push runs only on staging/main, so a PR branch commit runs CI once.
# Same conventions as the fleet: superseded runs cancelled, actions pinned by SHA, read-only token, pinned and
# checksum-verified tools.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # coverage-floor-check compares with the parent / base commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # TEST-STANDARD v1 §R-JS: no logic module, so the floor in .coverage-floor is the Playwright test count; it only goes up.
      - name: Coverage floor not lowered
        run: bash tools/coverage-floor-check.sh
      - name: Test count >= floor
        run: bash tools/test-count-check.sh
      - name: Playwright smoke (keyboard + touch, 0 console errors, hub CSP)
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks && rm -f gitleaks "$f"
      - name: Gate - fail on any finding
        run: gitleaks detect --source=. --redact --no-banner
