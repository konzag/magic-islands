name: CodeQL

# NIGHT-2 item 3 (2026-11-10): CodeQL for this public game repo, next to Semgrep + Gitleaks in ci.yml.
# javascript-typescript reads the inline <script> of index.html and the Playwright tests; actions reads the workflows.
# Public repo: GitHub-hosted runner only, never the homelab runner. No build step (buildless extraction).
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest   # public repo: GitHub-hosted only, never the homelab runner
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
