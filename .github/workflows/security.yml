name: Security

# Dependency/secret scan with Trivy (L1-38), same pinned, checksum-verified install as the fleet's
# template-app/games-hub security.yml. The gitleaks secret scan stays in ci.yml: its job id `gitleaks` is a
# required check (owner decision D21), so it is not duplicated here and no job here reuses that check name.
# Public repo: GitHub-hosted runner only, never the homelab runner. Read-only token, no SARIF upload.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

jobs:
  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest   # public repo: GitHub-hosted only, never the homelab runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy (pinned, checksum-verified)
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" trivy && mkdir -p "$RUNNER_TEMP/bin" && install -m 0755 trivy "$RUNNER_TEMP/bin/trivy" && rm -f trivy "$f"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/trivy" --version
      - name: Report - MEDIUM and above (never fails)
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: trivy fs . --severity MEDIUM,HIGH,CRITICAL --exit-code 0
      - name: Gate - fail on HIGH/CRITICAL with a fix available
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: trivy fs . --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
