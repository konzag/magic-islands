name: Security

# Canonical Security CI workflow (template-app/.github/workflows/security.yml), adapted:
#  - runs-on: ubuntu-latest. The self-hosted VM101 runners no longer exist (2026-10-09), so every job runs
#    on GitHub-hosted runners and installs its own scanners (pinned versions, sha256-verified tarballs).
#  - Triggers follow Option B: the heavier scanners run when code reaches staging/main, or on demand.
#    Fast checks (bandit, pip-audit) already run on every push in ci.yml.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install 'bandit[sarif]==1.9.4'
      - name: Run Bandit (SARIF report, never fails)
        run: bandit -r . -ll -c .bandit -f sarif -o bandit.sarif -x ./tests,./venv,./.venv || true
      - name: Gate - fail on MEDIUM+ findings
        run: bandit -r . -ll -c .bandit -f txt -x ./tests,./venv,./.venv
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
      - name: Upload Bandit SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bandit-sarif-${{ github.sha }}
          path: bandit.sarif
          retention-days: 30

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks && rm -f gitleaks "$f"
          gitleaks version
      - name: Run gitleaks scan (SARIF report, never fails)
        run: |
          gitleaks detect --source=. \
            --report-format=sarif \
            --report-path=gitleaks.sarif \
            --redact -v --exit-code=0
      - name: Gate - fail on any finding
        run: gitleaks detect --source=. --redact --no-banner
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: gitleaks.sarif
      - name: Upload Gitleaks SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-sarif-${{ github.sha }}
          path: gitleaks.sarif
          retention-days: 30

  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install trivy (pinned, checksum-verified)
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" trivy && sudo install -m 0755 trivy /usr/local/bin/trivy && rm -f trivy "$f"
          trivy --version
      - name: Run Trivy filesystem scan (SARIF report)
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy fs . \
            --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            --format sarif \
            --output trivy.sarif
      - name: Gate - fail on HIGH/CRITICAL with a fix available
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: trivy fs . --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-sarif-${{ github.sha }}
          path: trivy.sarif
          retention-days: 30

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Semgrep
        run: pip install 'semgrep==1.180.0'
      - name: Run Semgrep (gate - fails on findings, SARIF still uploaded)
        run: semgrep --config auto --error --sarif --output semgrep.sarif .
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-sarif-${{ github.sha }}
          path: semgrep.sarif
          retention-days: 30

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

  notify:
    name: Telegram Notify
    runs-on: ubuntu-latest
    needs: [bandit, gitleaks, trivy, semgrep]
    if: failure()
    steps:
      - name: Send Telegram alert
        env:
          BOT: ${{ secrets.TELEGRAM_CI_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CI_CHAT_ID }}
          TEXT: "Security CI failed for ${{ github.event.repository.name }} on ${{ github.ref_name }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$BOT" ] || [ -z "$CHAT" ]; then echo "::warning::Telegram secrets are not set for this repo"; exit 0; fi
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${BOT}/sendMessage" -d chat_id="$CHAT" --data-urlencode text="$TEXT"
