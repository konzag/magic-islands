# Dependabot: PRs go to `staging` (main only through the release PR and the owner's GO).
# cooldown 7 days on every entry (fleet semgrep rule dependabot-missing-cooldown).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
