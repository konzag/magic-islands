# Pre-commit hooks (STD-16). Versions pinned, in lock-step with requirements-dev.txt.
# Deviation from template-app: formatting is `ruff format` (line length 120), like the rest of the fleet's
# Option B apps, instead of black (one formatter, same result in CI and locally).
# Setup: pip install -r requirements-dev.txt && pre-commit install      Run: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: [--strict, --ignore-missing-imports]
        files: ^(app|tools)/
        additional_dependencies:
          - pydantic==2.14.0
          - pydantic-settings==2.15.0
          - structlog==26.1.0
          - fastapi==0.143.0
          - prometheus-fastapi-instrumentator==8.1.0

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-c', '.bandit']
        exclude: ^tests/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
