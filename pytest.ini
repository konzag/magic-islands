[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    network: real external HTTP calls (never in CI)
    integration: requires running services
    slow: takes >1 second
    unit: pure unit test
addopts = -q --strict-markers --tb=short --cov=app --cov-report=term-missing --cov-fail-under=90
# Warnings are errors (deprecations get fixed, not hidden).
filterwarnings =
    error
